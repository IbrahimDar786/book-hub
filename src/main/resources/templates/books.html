<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>

<div class="container mt-4">

<a th:href="@{/}" class="btn btn-secondary">
    Dashboard
</a>

<a th:href="@{/books/add}" class="btn btn-primary">
    Add Book
</a>

<br><br>


<h3>Search By Title</h3>

<form th:action="@{/books/search/title}" method="get">
    <input type="text" name="keyword"
           placeholder="Enter title">

    <button type="submit">
        Search
    </button>
</form>

<br>


<h3>Search By Author</h3>

<form th:action="@{/books/search/author}" method="get">

    <input type="text"
           name="keyword"
           placeholder="Enter author">

    <button type="submit">
        Search
    </button>

</form>

<a th:href="@{/books}">
    <button type="button">
        Show All Books
    </button>
</a>

<hr>



<h1 class="mb-4">Book List</h1>


<table class="table table-striped table-bordered table-hover mt-3">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Publisher</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.genre}"></td>
        <td th:text="${book.publisher}"></td>
        <td th:text="${book.price}"></td>

        <td>
            <a th:href="@{/books/edit/{id}(id=${book.id})}"
   class="btn btn-warning btn-sm">
    Edit
</a>

            |

            <a th:href="@{/books/delete/{id}(id=${book.id})}"
   class="btn btn-danger btn-sm">
    Delete
</a>
        </td>
    </tr>
    </tbody>

</table>
</div>
</body>
</html>
